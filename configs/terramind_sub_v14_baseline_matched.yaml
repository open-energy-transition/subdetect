# Matched baseline for v14_multitemporal (configs/terramind_sub_v14_multitemporal.yaml):
# IDENTICAL chip subset (same chip_ids, scripts/build_matched_baseline_index.py),
# same arch/loss/schedule, single median-composite image instead of the 4-date
# stack -- isolates the multi-temporal variable cleanly. Do NOT compare
# v14_multitemporal against the full-scale v5/v9 field_eval numbers instead of this:
# the ~600-chip subset here is 8-50x smaller than those, a confounded comparison.
data:
  index_path: data/chips_multidate/pakistan_india/index_baseline_matched.parquet
  batch_size: 4
  num_workers: 4
  modalities: [S2L2A]

task:
  model_factory: EncoderDecoderFactory
  model_args:
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  loss: tversky
  tversky_args: {alpha: 0.35, beta: 0.65, gamma: 1.33}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 120
  accumulate_grad_batches: 4

checkpoint_dir: data/models/stageA_v14_baseline_matched
patience: 40
monitor_mode: max
# 2026-07-31 retune: max_epochs/patience doubled to match v14_multitemporal.yaml's
# retune (same training-budget opportunity for both arms of the ablation) -- lr left
# unchanged here since this arm already converged sensibly (>=20000 m2 mean_peak
# 0.278 on the 170-installation eval) at only 56/60 epochs; the lr bump in the
# multitemporal config addresses a problem specific to that arm (see its comment).
